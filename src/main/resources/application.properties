spring.application.name=minerva-ai-service
spring.config.import=optional:file:.env[.properties]
server.port=${AI_SERVICE_PORT:8000}

ai.provider=${AI_PROVIDER:ollama}

ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen3:8b}
ai.ollama.timeout=${OLLAMA_TIMEOUT:180s}

ai.claude.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.api-version=${ANTHROPIC_API_VERSION:2026-10-21}
ai.claude.model=${ANTHROPIC_MODEL:claude-sonnet-4-5-20250929}
ai.claude.timeout=${ANTHROPIC_TIMEOUT:180s}
ai.claude.max-output-tokens=${ANTHROPIC_MAX_OUTPUT_TOKENS:16384}

ai.security.api-key=${AI_SERVICE_API_KEY}
ai.limits.max-pdf-bytes=${AI_SERVICE_MAX_PDF_BYTES:10485760}
ai.limits.max-extracted-characters=${AI_SERVICE_MAX_EXTRACTED_CHARS:1000000}
ai.limits.max-curriculum-source-characters=${AI_SERVICE_MAX_CURRICULUM_SOURCE_CHARS:4000000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
