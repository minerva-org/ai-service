spring.application.name=minerva-ai-service
spring.config.import=optional:file:.env[.properties]
server.port=${AI_SERVICE_PORT:8000}

ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen3:4b}
ai.ollama.timeout=${OLLAMA_TIMEOUT:180s}

ai.security.api-key=${AI_SERVICE_API_KEY}
ai.limits.max-pdf-bytes=${AI_SERVICE_MAX_PDF_BYTES:10485760}
ai.limits.max-extracted-characters=${AI_SERVICE_MAX_EXTRACTED_CHARS:300000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
